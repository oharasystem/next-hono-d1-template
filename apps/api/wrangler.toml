name = "next-hono-d1-template-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Compatibility flags to enable Node.js API support on Cloudflare Workers
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "next-hono-d1-template-db"
database_id = "d6809233-4818-4542-957d-e01306c56317"
migrations_dir = "../../packages/db/drizzle"

# Observability configuration for logging and tracing
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
